<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0d0e14" />
  <title>Dodge Arena</title>
</head>
<body>
  <div id="game"></div>

  <header id="hud">
    <div class="tl">
      <div id="hud-score" class="score">SCORE: 0</div>
      <div id="hud-best" class="best">BEST: 0</div>
    </div>
    <div id="hud-mode" class="mode"></div>
    <div class="tr">
      <div id="hud-level" class="level">LEVEL 1</div>
      <div class="btns">
        <button id="btn-cb" class="icon" aria-label="Colorblind-safe colors" aria-pressed="false" title="Colorblind-safe colors">
          <svg viewBox="0 0 24 24" width="18" height="18"><path class="eye" d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle class="pupil" cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-mute" class="icon" aria-label="Mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
        </button>
        <button id="btn-pause" class="icon" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="dim"></div>

  <!-- Looping control hint: hand-drag on touch, keycaps on desktop. -->
  <div id="hint" aria-hidden="true">
    <div class="hand">
      <svg viewBox="0 0 48 48" width="56" height="56"><path d="M18 22V9a3 3 0 0 1 6 0v11l1-.2V7a3 3 0 0 1 6 0v13l1 .1V10a3 3 0 0 1 6 0v17c0 9-5 15-13 15-5 0-8-2-11-6l-6-8a3 3 0 0 1 4.5-4z" fill="#fff" fill-opacity=".92"/></svg>
    </div>
    <div class="keys">
      <span class="k up">W</span>
      <span class="k">A</span><span class="k">S</span><span class="k">D</span>
    </div>
  </div>

  <section id="card" class="panel" hidden>
    <h1>DODGE ARENA</h1>
    <button id="btn-play" class="primary">PLAY</button>
    <button id="btn-daily" class="secondary">DAILY</button>
  </section>

  <section id="over" class="panel" hidden>
    <div id="over-new" class="new" hidden>NEW BEST</div>
    <div class="label">SCORE</div>
    <div id="over-score" class="big">0</div>
    <div class="row"><span id="over-best">BEST: 0</span><span class="sep">·</span><span id="over-level">LEVEL 1</span></div>
    <div class="retry">TAP TO RETRY</div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="endless" class="on">ENDLESS</button>
      <button data-mode="daily">DAILY</button>
    </div>
  </section>

  <section id="paused" class="panel slim" hidden>
    <div class="label big2">PAUSED</div>
  </section>

  <pre id="dev" hidden></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
